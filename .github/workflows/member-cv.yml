name: Deployment stabilization checks
on:
  pull_request:
    branches: [internal-member-platform-mvp, main]
  push:
    branches: [internal-member-platform-mvp, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run typecheck:api:runtime
      - run: npm run lint
      - run: npm test
      - run: npm run build
