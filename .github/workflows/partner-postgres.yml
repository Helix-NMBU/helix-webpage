name: Partner PostgreSQL concurrency

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partner-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: partner-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify independent funding and invoice transactions
        env:
          FINANCE_TEST_POSTGRES_URL: postgresql://postgres:partner-ci-only@127.0.0.1:5432/postgres
        run: npx vitest run test/api/_lib/partner-funding-concurrency.postgres.test.ts test/api/_lib/partner-rollover-concurrency.postgres.test.ts --maxWorkers=2
